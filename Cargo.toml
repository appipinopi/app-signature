[package]
name = "app-signature"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Shared creator signature and official links for appipinopi applications"
repository = "https://github.com/appipinopi/app-signature"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
webbrowser = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
